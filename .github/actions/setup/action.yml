name: Setup Action
description: Install Bun, restore the dependency cache, and install dependencies

inputs:
  turbo-team:
    description: Turborepo team slug
    required: true

runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ".bun-version"

    - uses: actions/cache@v6
      with:
        path: |
          ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

    - run: bun install --frozen-lockfile

    - name: Set up Turborepo Remote Cache
      uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
      with:
        team: ${{ inputs.turbo-team }}
